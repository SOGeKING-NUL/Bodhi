services:
  api:
    build: .
    restart: unless-stopped
    ports:
      # Host port is configurable (API_HOST_PORT in .env) to avoid clashes with
      # other local services. Container always listens on 8000.
      - "${API_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount source for fast iteration (no image rebuild on code change;
      # restart the container to pick changes up).
      - ./src:/app/src
      # Persist model downloads across restarts
      - model_cache:/root/.deepface
      - yolo_cache:/root/ultralytics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  model_cache:
  yolo_cache:
