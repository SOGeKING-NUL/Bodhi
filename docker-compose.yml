version: '3.8'

services:
  # Backend API Service - FastAPI with ML models
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bodhi-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Redis URL to use Docker network
      - REDIS_URL=redis://redis:6379
      # Python environment
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Persist ML model downloads across container restarts
      # DeepFace models (~100MB) and YOLO models (~6MB)
      - deepface_models:/home/bodhi/.deepface
      - yolo_models:/home/bodhi/ultralytics
    networks:
      - bodhi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis Service - Caching and session management
  redis:
    image: redis:7-alpine
    container_name: bodhi-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - bodhi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Named volumes for persistent data
volumes:
  deepface_models:
    driver: local
  yolo_models:
    driver: local

# Custom network for service communication
networks:
  bodhi-network:
    driver: bridge
